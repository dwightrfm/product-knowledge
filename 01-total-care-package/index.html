</style><script>
function copyLink(url,btn){
  const done=()=>{const t=btn.textContent;btn.textContent='Link copied';btn.classList.add('ok');setTimeout(()=>{btn.textContent=t;btn.classList.remove('ok')},1800)};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(url).then(done,()=>fallback(url,done))}else fallback(url,done);
}
function fallback(url,done){const a=document.createElement('textarea');a.value=url;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();
  try{document.execCommand('copy');done()}catch(e){prompt('Copy this link:',url)}a.remove()}
