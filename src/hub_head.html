<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{--bg:#04151b;--bg2:#08252e;--ink:#f4f8f9;--mut:rgba(228,240,243,.68);--dim:rgba(228,240,243,.42);
--teal:#46d9d2;--gold:#ffc46b;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
background:radial-gradient(120% 70% at 50% 110%,#0f4a52 0%,rgba(15,74,82,0) 60%),linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:28px 16px 40px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px var(--teal)}
h1{font-size:clamp(44px,9vw,76px);font-weight:900;letter-spacing:-.02em;line-height:1;margin:18px 0 12px}
h1 em,h2 em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--teal)}
.lead{color:var(--mut);font-size:18px;line-height:1.5;max-width:560px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-top:34px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;
backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.thumb{position:relative;display:block;aspect-ratio:9/16;background:#000;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.thumb:hover img{transform:scale(1.03)}
.play{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;
background:rgba(4,21,27,.72);border:2px solid var(--teal);display:grid;place-items:center;box-shadow:0 0 24px rgba(70,217,210,.45)}
.play:after{content:"";border-left:20px solid var(--ink);border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
.num{position:absolute;left:12px;top:12px;font-size:13px;font-weight:800;letter-spacing:.12em;background:rgba(4,21,27,.75);
border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.dur{position:absolute;right:12px;bottom:12px;font-size:13px;font-weight:700;background:rgba(4,21,27,.75);border-radius:8px;padding:4px 8px}
.body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:12px;flex:1}
.title{font-size:18px;font-weight:800;line-height:1.25;text-decoration:none}
.btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font:700 14px Inter,sans-serif;
border-radius:12px;padding:11px 14px;cursor:pointer;margin-top:auto;min-height:44px}
.btn:hover{border-color:var(--teal)}
.btn.ok{border-color:var(--gold);color:var(--gold)}
footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);color:var(--dim);font-size:13px;line-height:1.6}
.player{max-width:460px;margin:0 auto}
.player video{width:100%;aspect-ratio:9/16;border-radius:22px;background:#000;display:block;border:1px solid var(--line)}
.back{display:inline-block;margin-bottom:18px;color:var(--mut);text-decoration:none;font-weight:700;font-size:15px}
.back:hover{color:var(--teal)}
h2{font-size:clamp(30px,7vw,42px);font-weight:900;line-height:1.08;margin:14px 0 6px}
.meta{color:var(--mut);font-size:15px;margin-bottom:18px}
.row{display:flex;gap:10px;margin-top:16px}.row .btn{flex:1;margin:0;text-align:center;text-decoration:none}

.list{display:flex;flex-direction:column;gap:12px;margin-top:30px;max-width:640px}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.item.open{border-color:rgba(70,217,210,.55);box-shadow:0 0 0 1px rgba(70,217,210,.25),0 10px 30px rgba(0,0,0,.3)}
.vbtn{appearance:none;width:100%;display:flex;align-items:center;gap:14px;background:none;border:0;color:var(--ink);
font:800 18px Inter,sans-serif;text-align:left;padding:16px 16px;min-height:64px;cursor:pointer}
.vbtn:hover .vtitle{color:var(--teal)}
.vnum{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:800;
background:rgba(70,217,210,.14);border:1px solid rgba(70,217,210,.45);color:var(--teal)}
.vtitle{flex:1;line-height:1.25}
.vlen{flex:none;color:var(--mut);font-size:14px;font-weight:700}
.chev{flex:none;width:10px;height:10px;border-right:2.5px solid var(--mut);border-bottom:2.5px solid var(--mut);transform:rotate(45deg);margin:0 4px 4px 2px;transition:transform .2s}
.open .chev{transform:rotate(-135deg);margin-bottom:-4px}
.panel{padding:0 16px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;animation:fadein .25s ease}
.panel video{width:100%;max-width:380px;aspect-ratio:9/16;border-radius:16px;background:#000;display:block;border:1px solid var(--line)}
.panel .btn{width:100%;max-width:380px;margin:0}
.panel[hidden]{display:none}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.chev{transition:none}}
</style><script>
function copyLink(url,btn){
  const done=()=>{const t=btn.textContent;btn.textContent='Link copied';btn.classList.add('ok');setTimeout(()=>{btn.textContent=t;btn.classList.remove('ok')},1800)};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(url).then(done,()=>fallback(url,done))}else fallback(url,done);
}
function fallback(url,done){const a=document.createElement('textarea');a.value=url;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();
  try{document.execCommand('copy');done()}catch(e){prompt('Copy this link:',url)}a.remove()}

function setOpen(item,on){
  const b=item.querySelector('.vbtn'),p=item.querySelector('.panel'),v=p.querySelector('video');
  item.classList.toggle('open',on);b.setAttribute('aria-expanded',on);p.hidden=!on;
  if(on){if(!v.src)v.src=v.dataset.src;v.play().catch(()=>{})}else{v.pause()}
}
function toggle(btn){
  const item=btn.closest('.item'),opening=!item.classList.contains('open');
  const before=btn.getBoundingClientRect().top;
  document.querySelectorAll('.item.open').forEach(o=>{if(o!==item)setOpen(o,false)});
  setOpen(item,opening);
  window.scrollBy(0,btn.getBoundingClientRect().top-before);
}
</script>
